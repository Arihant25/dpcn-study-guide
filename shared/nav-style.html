<style>
/* page switcher, shared by the sidebar and the phone menu */
.pages{display:grid; gap:4px; margin-top:16px}
.pages a{display:flex; gap:10px; align-items:flex-start; padding:7px 10px; border:1px solid var(--border); border-radius:8px; color:var(--fg); text-decoration:none; line-height:1.3; font-weight:600; font-size:.86rem}
.pages a:hover{background:var(--muted)}
.pages b{flex:none; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:.74rem; background:var(--muted); color:var(--muted-fg)}
.pages small{display:block; font-weight:400; font-size:.74rem; color:var(--muted-fg); margin-top:2px}
body[data-pg="remember"] .pages a[data-pg="remember"], body[data-pg="quiz1"] .pages a[data-pg="quiz1"],
body[data-pg="mid"] .pages a[data-pg="mid"], body[data-pg="after"] .pages a[data-pg="after"]{border-color:var(--brand); background:var(--brand-soft)}
body[data-pg="remember"] .pages a[data-pg="remember"] b, body[data-pg="quiz1"] .pages a[data-pg="quiz1"] b,
body[data-pg="mid"] .pages a[data-pg="mid"] b, body[data-pg="after"] .pages a[data-pg="after"] b{background:var(--brand); color:var(--brand-fg)}
.toc .pages a{padding:6px 9px}

/* phone and tablet: a sticky bar that opens a menu of pages and sections */
@media(max-width:1059px){
  .themebtn{top:auto; bottom:14px}
  .tocwrap-mobile{position:sticky; top:0; z-index:15; background:var(--bg); border-bottom:1px solid var(--border);
    margin:0 calc(-1 * clamp(18px,5vw,72px)); padding:8px clamp(18px,5vw,72px)}
  details.mtoc{border:0; padding:0; background:transparent}
  details.mtoc>summary{list-style:none; display:flex; align-items:center; gap:10px; padding:4px 0; font-size:.9rem}
  details.mtoc>summary::-webkit-details-marker{display:none}
  details.mtoc .here{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted-fg); font-weight:500}
  details.mtoc .mbtn{flex:none; border:1px solid var(--border-2); border-radius:8px; padding:6px 12px; font-weight:600; background:var(--card); color:var(--fg)}
  details.mtoc[open] .mbtn{background:var(--primary); color:var(--primary-fg); border-color:var(--primary)}
  .mpanel{max-height:calc(100vh - 70px); max-height:calc(100dvh - 70px); overflow-y:auto; padding:6px 0 14px; overscroll-behavior:contain}
  .mpanel .pages{margin-top:4px}
  .mpanel .pages a{padding:10px 12px; font-size:.95rem}
  .mgrp{text-transform:uppercase; letter-spacing:.11em; font-size:.66rem; color:var(--muted-fg); font-weight:700; margin:14px 0 4px}
  details.mtoc .mpanel>a{display:block; padding:8px 4px; color:var(--fg); text-decoration:none; border-bottom:1px solid var(--border); font-size:.95rem}
}
@media(max-width:700px){
  html,body{overflow-x:clip}
  .tocwrap-mobile{margin:0 -16px; padding:8px 16px}
}
</style>
