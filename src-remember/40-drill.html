<script>
/* Flashcard drill: builds one card at a time from the details.fc list.
   "Didn't know" puts the card back a few places later in the round. */
(function(){
  var box=document.getElementById('drill'); if(!box) return;
  var all=[].slice.call(document.querySelectorAll('#cardlist details.fc')).map(function(d){
    var s=d.querySelector('summary').children;
    return {pg:d.getAttribute('data-pg'), tag:s[0].textContent, q:s[1].innerHTML, a:d.querySelector('.ans').innerHTML};
  });
  var qEl=document.getElementById('drill-q'), aEl=document.getElementById('drill-a'), btns=document.getElementById('drill-btns'),
      tagEl=document.getElementById('drill-tag'), countEl=document.getElementById('drill-count'), bar=document.getElementById('drill-bar');
  var deck=[], done=0, total=0, filter='all', touched=false;
  box.addEventListener('click',function(){ touched=true; });
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function button(label,cls,fn){ var b=document.createElement('button'); b.type='button'; b.textContent=label; if(cls) b.className=cls; b.addEventListener('click',fn); btns.appendChild(b); return b; }
  function start(){
    deck=shuffle(all.filter(function(c){ return filter==='all'||c.pg===filter; }).slice());
    total=deck.length; done=0; show();
  }
  function progress(){ countEl.textContent=done+' of '+total+' known'; bar.style.width=(total?100*done/total:0)+'%'; }
  function show(){
    btns.innerHTML=''; aEl.hidden=true; progress();
    if(!deck.length){
      tagEl.textContent='Round finished';
      qEl.textContent='You got through all '+total+' cards. Come back tomorrow and do it again, that\'s when it really sticks.';
      button('Start again','go',start); return;
    }
    var c=deck[0]; tagEl.textContent=c.tag; qEl.innerHTML=c.q;
    var b0=button('Show answer','go',function(){
      aEl.innerHTML=c.a; aEl.hidden=false; btns.innerHTML='';
      button('Knew it','yes',function(){ deck.shift(); done++; show(); }).focus({preventScroll:true});
      button('Didn\'t know','',function(){ deck.shift(); deck.splice(Math.min(3,deck.length),0,c); show(); });
    }); if(touched) b0.focus({preventScroll:true});
  }
  document.querySelectorAll('#drill-filters button').forEach(function(b){
    b.addEventListener('click',function(){
      filter=b.getAttribute('data-f');
      document.querySelectorAll('#drill-filters button').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
      start();
    });
  });
  box.hidden=false; start();
})();
</script>
